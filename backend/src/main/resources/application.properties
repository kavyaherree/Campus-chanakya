server.port=${SERVER_PORT:8080}

# ==============================================================================
# DATASOURCE & DATABASE CONFIGURATION (Embedded H2 / MySQL)
# ==============================================================================
# Default: File-backed persistent H2 database with MySQL compatibility mode
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/campus_chanakya;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==============================================================================
# HIBERNATE / JPA CONFIGURATION
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Note: To switch to external MySQL server in .env:
# SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/campus_chanakya?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# SPRING_DATASOURCE_USERNAME=root
# SPRING_DATASOURCE_PASSWORD=your_password
# SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
# SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# SECURITY & JWT CONFIGURATION
# ==============================================================================
# 256-bit base64-encoded secret key for HMAC-SHA256 signature
campuschanakya.jwt.secret=${CAMPUSCHANAKYA_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
campuschanakya.jwt.expiration-ms=${CAMPUSCHANAKYA_JWT_EXPIRATION_MS:86400000}

# ==============================================================================
# JACKSON CONFIGURATION
# ==============================================================================
spring.jackson.serialization.fail-on-empty-beans=false

# ==============================================================================
# LOGGING
# ==============================================================================
logging.level.com.campuschanakya=DEBUG
logging.level.org.springframework.security=INFO

# ==============================================================================
# EMAIL (SMTP) DISPATCH CONFIGURATION
# ==============================================================================
spring.mail.host=${SPRING_MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${SMTP_EMAIL:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

